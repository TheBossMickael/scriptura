[profile.default]
solc_version = "0.8.24"
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Deploy script writes addresses + START_BLOCK to ../deployments/<chain>.json (trap #6)
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[invariant]
runs = 128
depth = 64
# Handlers are written to never revert (bounded amounts, pause guards): any revert in a
# fuzzed sequence is a real bug, not noise to be skipped.
fail_on_revert = true

# Sepolia: `make deploy-sepolia` passes --rpc-url "$SEPOLIA_RPC_URL" directly, but the rpc
# alias lets verify / manual `forge verify-contract --rpc-url sepolia` resolve it too. Both
# values are interpolated from the (gitignored) .env at runtime — no secrets are committed.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
